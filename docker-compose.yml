services:
  agentmind:
    build: .
    container_name: agentmind
    ports:
      - "${SERVER_PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      # 强制使用 3100 作为容器内端口，与 EXPOSE 一致；
      # 宿主机端口由 ports 映射决定（从 .env 或 SERVER_PORT 读取）。
      - PORT=3100
    restart: unless-stopped
    # 如需健康检查，取消下面注释：
    # healthcheck:
    #   test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
